name: test-env-vars

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
jobs:
  print_vars:
    runs-on: ubuntu-latest
    steps:
      - name: Print GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: |
          echo "$GITHUB_CONTEXT" | jq ."          
