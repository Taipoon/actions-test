name: test-env-vars

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
jobs:
  print_vars:
    runs-on: ubuntu-latest
    env:
      SOME_KEY_REF: "${{ vars.SOME_KEY }}"
    steps:
      - name: Print GitHub context
        run: |
          echo "${{ env.SOME_KEY_REF }}"
